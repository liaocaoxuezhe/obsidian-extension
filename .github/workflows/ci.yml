name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run official Obsidian lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run public regression tests
        run: npm run test:public

      - name: Enforce tracked and workspace repository boundary
        run: |
          node scripts/check-public-boundary.mjs --mode tracked
          node scripts/check-public-boundary.mjs --mode workspace

      - name: Build production plugin
        run: npm run build
