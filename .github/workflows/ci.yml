name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run official Obsidian lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run public regression tests
        env:
          ANALOGY_TEST_EXECUTION_MANIFEST: artifacts/test-execution/public.json
        run: npm run test:public

      - name: Verify public test execution manifest
        if: always()
        run: node scripts/verify-test-execution-set.mjs --set public --execution artifacts/test-execution/public.json

      - name: Upload public test execution manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-test-execution-${{ github.sha }}
          path: artifacts/test-execution/public.json
          if-no-files-found: error

      - name: Enforce tracked and workspace repository boundary
        run: |
          node scripts/check-public-boundary.mjs --mode tracked
          node scripts/check-public-boundary.mjs --mode workspace

      - name: Build production plugin
        run: npm run build
