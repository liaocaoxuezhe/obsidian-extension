name: Obsidian managed runtime matrix

on:
  pull_request:
    paths:
      - "main.ts"
      - "src/**"
      - "scripts/**"
      - "runtime-package/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/obsidian-runtime-matrix.yml"
  push:
    branches: [main]
    paths:
      - "main.ts"
      - "src/**"
      - "scripts/**"
      - "runtime-package/**"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/obsidian-runtime-matrix.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified runtime release after the supported native jobs pass
        type: boolean
        default: false
      runtime_tag:
        description: Immutable runtime release tag; must equal runtime-<version> of the selected platforms in runtime-package/platform-versions.json
        required: true
      platforms:
        description: Comma separated platforms to build and publish (others keep their published version)
        required: true
        default: win32-x64

permissions:
  contents: read

concurrency:
  group: obsidian-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve platforms from the reviewed version table
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Plan runtime matrix
        id: plan
        shell: bash
        env:
          REQUESTED_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'darwin-arm64,win32-x64' }}
          RUNTIME_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_tag || '' }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            node scripts/runtime-platform-versions.mjs plan --platforms "$REQUESTED_PLATFORMS" --tag "$RUNTIME_TAG"
          else
            node scripts/runtime-platform-versions.mjs plan --platforms "$REQUESTED_PLATFORMS"
          fi
          echo "matrix=$(node scripts/runtime-platform-versions.mjs matrix --platforms "$REQUESTED_PLATFORMS")" >> "$GITHUB_OUTPUT"
          echo "platforms=$REQUESTED_PLATFORMS" >> "$GITHUB_OUTPUT"

  native-runtime:
    name: ${{ matrix.key }} native pack and contracts
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install reviewed plugin dependencies
        run: npm ci --ignore-scripts
      - name: Download and verify pinned Chroma CLI 1.4.4
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then output="test/.runtime/chroma.exe"; else output="test/.runtime/chroma"; fi
          node test/helpers/download-pinned-chroma.js --version cli-1.4.4 --output "$output"
          echo "ANALOGY_CHROMA_BIN=${{ github.workspace }}/$output" >> "$GITHUB_ENV"
      - name: Build Community plugin
        run: npm run build:ci
      - name: Run unit, contract, worker, Chroma and Community harnesses
        env:
          ANALOGY_TEST_EXECUTION_MANIFEST: artifacts/test-execution/runtime-${{ matrix.key }}.json
        run: npm run test:runtime
      - name: Verify runtime test execution manifest
        if: always()
        run: node scripts/verify-test-execution-set.mjs --set runtime --execution artifacts/test-execution/runtime-${{ matrix.key }}.json
      - name: Upload runtime test execution manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-test-execution-${{ matrix.key }}-${{ github.sha }}
          path: artifacts/test-execution/runtime-${{ matrix.key }}.json
          if-no-files-found: error
      - name: Build native embedding runtime
        run: node scripts/build-embedding-runtime.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --node-version 22.23.2 --output dist/runtime
      # Hosted Windows runners already have the VC++ runtime, so they cannot prove a clean
      # machine works; at least prove the app-local copies are inside the shipped archive.
      - name: Verify the app-local Visual C++ runtime is packed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Get-ChildItem dist/runtime -Filter "analogy-embedding-runtime-*-win32-x64.zip" | Select-Object -First 1
          if (-not $archive) { Write-Error "Windows runtime archive not found"; exit 1 }
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try { $entries = $zip.Entries | ForEach-Object { $_.FullName.Replace("\", "/") } } finally { $zip.Dispose() }
          foreach ($dll in "msvcp140.dll", "msvcp140_1.dll", "msvcp140_atomic_wait.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not ($entries | Where-Object { $_ -like "*/onnxruntime-node/bin/napi-v6/win32/x64/$dll" })) {
              Write-Error "$dll missing from $($archive.Name)"; exit 1
            }
          }
          Write-Output "All VC++ runtime DLLs are packed in $($archive.Name)"
      - name: Run fresh-cache native inference smoke
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/run-native-runtime-smoke.mjs --platform ${{ matrix.key }} --input dist/runtime --output dist/runtime/native-smoke-statement.json
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          cosign-release: v3.0.4
      - name: Sign native smoke statement with GitHub OIDC and Rekor
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          archive="dist/runtime/$(node scripts/runtime-platform-versions.mjs archive --platform ${{ matrix.key }})"
          bundle="$archive.smoke-attestation.json"
          cosign attest-blob --yes --new-bundle-format=true --statement dist/runtime/native-smoke-statement.json --bundle "$bundle" "$archive"
          node scripts/finalize-runtime-artifact.mjs --platform ${{ matrix.key }} --input dist/runtime --attestation "$bundle"
          rm dist/runtime/native-smoke-statement.json
      - name: Resolve the versioned archive name
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: archive
        shell: bash
        run: echo "name=$(node scripts/runtime-platform-versions.mjs archive --platform ${{ matrix.key }})" >> "$GITHUB_OUTPUT"
      - name: Upload completed native generation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: completed-runtime-${{ matrix.key }}
          path: dist/runtime/${{ steps.archive.outputs.name }}*
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Merge, publish and redownload-verify the per-platform runtime manifest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: [plan, native-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_TAG: ${{ inputs.runtime_tag }}
      PLATFORMS: ${{ needs.plan.outputs.platforms }}
      RELEASE_ROOT: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install reviewed plugin dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: completed-runtime-*
          path: dist/runtime
          merge-multiple: true
      - name: Download carried platforms from their own immutable releases
        shell: bash
        run: |
          node scripts/runtime-platform-versions.mjs plan --platforms "$PLATFORMS" --tag "$RUNTIME_TAG" > plan.json
          node -e "for (const c of require('./plan.json').carried) console.log(c.tag + ' ' + c.fileName)" | while read -r tag file; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/runtime --pattern "$file*"
          done
      - name: Merge and validate the per-platform manifest
        run: |
          node scripts/generate-runtime-manifest.mjs --input dist/runtime --output src/runtime/generated-embedding-runtime-manifest.ts --release-root "$RELEASE_ROOT"
          node scripts/prepare-release.mjs --runtime-only --runtime-staging dist/runtime
      - name: Refuse to overwrite any published runtime asset
        shell: bash
        run: |
          if gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing.txt 2>/dev/null; then
            for platform in $(node -e "console.log(require('./plan.json').platforms.join(' '))"); do
              archive=$(node scripts/runtime-platform-versions.mjs archive --platform "$platform")
              if grep -q "^$archive" existing.txt; then echo "::error::$RUNTIME_TAG already contains $archive; runtime releases are immutable"; exit 1; fi
            done
            if grep -qx "embedding-runtime-manifest.json" existing.txt; then echo "::error::$RUNTIME_TAG already has a manifest"; exit 1; fi
          fi
      - name: Publish only the newly built platforms and the merged manifest
        shell: bash
        run: |
          gh release view "$RUNTIME_TAG" >/dev/null 2>&1 || gh release create "$RUNTIME_TAG" --title "Analogy managed runtime $RUNTIME_TAG" --notes "Native runner verified runtime assets for $PLATFORMS. Other platforms keep their published runtime release."
          files=(dist/runtime/embedding-runtime-manifest.json)
          for platform in $(node -e "console.log(require('./plan.json').platforms.join(' '))"); do
            archive=$(node scripts/runtime-platform-versions.mjs archive --platform "$platform")
            files+=(dist/runtime/"$archive"*)
          done
          gh release upload "$RUNTIME_TAG" "${files[@]}"
      - name: Redownload every platform from its own release and re-verify every SHA and attestation
        shell: bash
        run: |
          mkdir redownload
          gh release download "$RUNTIME_TAG" --dir redownload
          node -e "for (const c of require('./plan.json').carried) console.log(c.tag + ' ' + c.fileName)" | while read -r tag file; do
            gh release download "$tag" --dir redownload --pattern "$file*"
          done
          node scripts/prepare-release.mjs --runtime-only --runtime-staging redownload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-runtime-manifest-${{ inputs.runtime_tag }}
          path: |
            src/runtime/generated-embedding-runtime-manifest.ts
            dist/runtime/embedding-runtime-manifest.json
          if-no-files-found: error
